<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor El Aleph</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --accent: #3fb950;
  --accent2: #58a6ff;
  --warn: #f78166;
  --text: #e6edf3;
  --muted: #8b949e;
  --card: #21262d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
#logo { display: flex; align-items: center; gap: 8px; }
#logo-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, #3fb950, #1a7f37);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
#logo-text { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: var(--text); }
#logo-sub { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: 1px; }
.hdiv { width: 1px; height: 24px; background: var(--border); }
.layer-group { display: flex; gap: 4px; }
.lbtn {
  font-size: 11px; font-family: 'DM Sans', sans-serif; font-weight: 500;
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.lbtn:hover { border-color: var(--accent); color: var(--text); }
.lbtn.on { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
.label-xs { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: 0.5px; text-transform: uppercase; }
#date-sel {
  font-size: 11px; padding: 5px 10px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--card); color: var(--text);
  cursor: pointer; font-family: 'Space Mono', monospace;
}
#status-wrap { margin-left: auto; display: flex; align-items: center; gap: 7px; }
#sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
#sdot.ok { background: var(--accent); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
#stxt { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; }
#main { display: flex; flex: 1; overflow: hidden; }
#map-wrap { flex: 1; position: relative; }
#map { width: 100%; height: 100%; }
#sidebar {
  width: 240px; background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
}
#sidebar-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
#sidebar-header h3 { font-size: 11px; font-family: 'Space Mono', monospace; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
#lots-list { flex: 1; overflow-y: auto; padding: 8px; }
.lot-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 6px; cursor: pointer; transition: all 0.15s; position: relative;
}
.lot-card:hover { border-color: var(--accent); }
.lot-card.active { border-color: var(--accent); background: #1a2e1a; }
.lot-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.lot-meta { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; }
.lot-ha { position: absolute; top: 10px; right: 10px; font-size: 10px; font-family: 'Space Mono', monospace; color: var(--accent); font-weight: 700; }
.lot-ndvi-bar { margin-top: 8px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
.lot-ndvi-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #d73027, #f46d43, #fdae61, #fee08b, #d9ef8b, #a6d96a, #66bd63, #1a9850); transition: width 0.5s; }
.ndvi-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-family: 'Space Mono', monospace; padding: 2px 6px; border-radius: 4px; margin-top: 6px; font-weight: 700; }
#sidebar-bottom { border-top: 1px solid var(--border); padding: 10px; }
#voice-btn {
  width: 100%; padding: 10px; background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12px;
  font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 7px; transition: all 0.15s; margin-bottom: 6px;
}
#voice-btn:hover { border-color: var(--warn); }
#voice-btn.recording { background: #3d1a1a; border-color: var(--warn); color: var(--warn); }
#legend {
  position: absolute; bottom: 16px; left: 16px;
  background: rgba(13,17,23,0.92); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 13px; z-index: 999; backdrop-filter: blur(8px);
}
#legend-title { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; margin-bottom: 6px; }
#legend canvas { display: block; width: 140px; height: 10px; border-radius: 3px; margin-bottom: 4px; }
.leg-row { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); font-family: 'Space Mono', monospace; }
#toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 8px 18px; border-radius: 20px; font-size: 12px; z-index: 9999;
  transition: transform 0.3s; pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }
#notes-panel { display: none; padding: 8px; border-top: 1px solid var(--border); max-height: 160px; overflow-y: auto; }
#notes-panel.open { display: block; }
.note-item { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; margin-bottom: 5px; font-size: 11px; }
.note-date { font-size: 9px; color: var(--muted); font-family: 'Space Mono', monospace; margin-bottom: 3px; }
.note-text { color: var(--text); line-height: 1.4; }
.note-empty { color: var(--muted); font-size: 11px; text-align: center; padding: 12px 0; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.leaflet-container { background: #0d1117; }
.leaflet-control-zoom a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--border) !important; }
#ndvi-loading {
  position: absolute; top: 12px; right: 12px;
  background: rgba(13,17,23,0.9); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px; font-size: 11px;
  font-family: 'Space Mono', monospace; color: var(--accent);
  z-index: 999; display: none; align-items: center; gap: 8px;
}
#ndvi-loading.show { display: flex; }
.spinner { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="header">
  <div id="logo">
    <div id="logo-icon">🌿</div>
    <div>
      <div id="logo-text">EL ALEPH</div>
      <div id="logo-sub">MONITOR AGRONÓMICO</div>
    </div>
  </div>
  <div class="hdiv"></div>
  <div style="display:flex;align-items:center;gap:6px;">
    <span class="label-xs">CAPA</span>
    <div class="layer-group">
      <button class="lbtn on" id="btn-sat" onclick="setLayer('sat')">Satélite</button>
      <button class="lbtn" id="btn-topo" onclick="setLayer('topo')">Topo</button>
    </div>
  </div>
  <div class="hdiv"></div>
  <div style="display:flex;align-items:center;gap:6px;">
    <span class="label-xs">FECHA</span>
    <select id="date-sel" onchange="onDateChange()">
      <option value="2026-04-01/2026-04-10">Abr 2026</option>
      <option value="2026-03-01/2026-03-31">Mar 2026</option>
      <option value="2026-02-01/2026-02-28">Feb 2026</option>
      <option value="2026-01-01/2026-01-31">Ene 2026</option>
      <option value="2025-12-01/2025-12-31">Dic 2025</option>
      <option value="2025-11-01/2025-11-30">Nov 2025</option>
      <option value="2025-10-01/2025-10-31">Oct 2025</option>
    </select>
  </div>
  <div id="status-wrap">
    <div id="sdot"></div>
    <span id="stxt">cargando...</span>
  </div>
</div>

<div id="main">
  <div id="map-wrap">
    <div id="map"></div>
    <div id="legend">
      <div id="legend-title">NDVI</div>
      <canvas id="legend-canvas"></canvas>
      <div class="leg-row"><span>-1</span><span>0</span><span>+1</span></div>
    </div>
    <div id="ndvi-loading"><div class="spinner"></div><span>Cargando NDVI...</span></div>
  </div>
  <div id="sidebar">
    <div id="sidebar-header"><h3>Lotes</h3></div>
    <div id="lots-list"></div>
    <div id="notes-panel"></div>
    <div id="sidebar-bottom">
      <button id="voice-btn" onclick="toggleVoice()">
        <span id="voice-icon">🎙️</span>
        <span id="voice-label">Grabar anotación</span>
      </button>
      <div id="voice-status" style="font-size:10px;color:var(--muted);text-align:center;min-height:14px;font-family:'Space Mono',monospace;"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─── LOTES CON COORDENADAS REALES DE KMZ ─────────────────────────────
const LOTS = [
  {
    id: 'baronetti',
    name: 'Baronetti Lote Sur',
    client: 'Baronetti',
    ha: 49.8,
    color: '#3fb950',
    coords: [
      [-31.22036317411274, -61.48303497094992],
      [-31.22118416341140, -61.47819839331395],
      [-31.22168279146114, -61.47797641694797],
      [-31.22198893686958, -61.47773570643056],
      [-31.22284438733052, -61.47789610290850],
      [-31.22290458681472, -61.47757659306834],
      [-31.22044373407267, -61.47699935817017],
      [-31.22024238608856, -61.47800115786195],
      [-31.22099617316868, -61.47822617273120],
      [-31.22006030143944, -61.48277380645671],
      [-31.21959609828583, -61.48274555017996],
      [-31.22001010697997, -61.47167874834972],
      [-31.22527167214740, -61.47317586769794],
      [-31.22324135222972, -61.48385986920024],
      [-31.22058704969472, -61.48309274565683],
      [-31.22036317411274, -61.48303497094992]
    ]
  },
  {
    id: 'salari',
    name: 'Salari Sur y Norte',
    client: 'Salari (50% El Aleph / 50% Lucas)',
    ha: 86.7,
    color: '#58a6ff',
    coords: [
      [-31.27113207779932, -61.69095192323584],
      [-31.27044807923644, -61.68402596147863],
      [-31.27180101352654, -61.67728519654274],
      [-31.27804737264167, -61.67881045779503],
      [-31.27574039043199, -61.69204904010132],
      [-31.27151179250234, -61.69098913119504],
      [-31.27142057968247, -61.69100651022310],
      [-31.27138707887207, -61.69099778326411],
      [-31.27126980070651, -61.69096722852084],
      [-31.27119908324168, -61.69096937758381],
      [-31.27111159477884, -61.69096715817393],
      [-31.27113207779932, -61.69095192323584]
    ]
  }
];

// ─── NDVI via WMS público de Copernicus/Sentinel Hub ─────────────────
// Usamos el servicio WMS de EO Browser que no requiere CORS
const WMS_NDVI_URL = 'https://services.sentinel-hub.com/ogc/wms/cd280189-7c51-45a6-ab05-f96a76067710';

let ndviLayer = null;
let currentDateRange = '2026-04-01/2026-04-10';
let currentLayer = 'ndvi';

const map = L.map('map', { zoomControl: true, attributionControl: false });

const baseLayers = {
  sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
  topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 })
};

baseLayers.sat.addTo(map);

// ─── CAPAS ────────────────────────────────────────────────────────────
function setLayer(type) {
  currentLayer = type;
  document.querySelectorAll('.lbtn').forEach(b => b.classList.remove('on'));
  document.getElementById('btn-' + type).classList.add('on');
  Object.values(baseLayers).forEach(l => { if (map.hasLayer(l)) map.removeLayer(l); });
  if (type === 'sat') {
    baseLayers.sat.addTo(map);
    setStatus('ok', 'Satélite');
  } else if (type === 'topo') {
    baseLayers.topo.addTo(map);
    setStatus('ok', 'Topográfico');
  }
  setTimeout(() => LOTS.forEach(l => { if (l._polygon) l._polygon.bringToFront(); }), 300);
}

function loadNDVI() {
  showNDVILoading(true);
  setStatus('', 'Cargando NDVI...');

  const dates = currentDateRange.split('/');
  const timeParam = dates[0] + 'T00:00:00Z/' + dates[1] + 'T23:59:59Z';

  // WMS público de Sentinel Hub (instancia demo con acceso a Sentinel-2)
  ndviLayer = L.tileLayer.wms(WMS_NDVI_URL, {
    layers: 'NDVI',
    format: 'image/png',
    transparent: true,
    version: '1.3.0',
    TIME: timeParam,
    MAXCC: 20,
    opacity: 0.85,
    crossOrigin: true
  });

  let loaded = false;
  ndviLayer.on('tileload', () => {
    if (!loaded) {
      loaded = true;
      showNDVILoading(false);
      setStatus('ok', 'NDVI Sentinel-2');
    }
  });

  ndviLayer.on('tileerror', () => {
    showNDVILoading(false);
    setStatus('err', 'NDVI no disponible');
    showToast('NDVI: usando vista satélite');
  });

  ndviLayer.addTo(map);

  // Timeout fallback
  setTimeout(() => {
    if (!loaded) {
      showNDVILoading(false);
      setStatus('ok', 'Satélite activo');
    }
  }, 8000);
}

function onDateChange() {
  currentDateRange = document.getElementById('date-sel').value;
  if (ndviLayer) { map.removeLayer(ndviLayer); ndviLayer = null; }
  if (currentLayer === 'ndvi') loadNDVI();
}

// ─── POLÍGONOS ────────────────────────────────────────────────────────
let activeLot = null;
const notes = {};

LOTS.forEach(lot => {
  notes[lot.id] = [];
  lot.ndviValue = null;

  const poly = L.polygon(lot.coords, {
    color: lot.color,
    weight: 2.5,
    fillColor: lot.color,
    fillOpacity: 0.15
  });

  poly.on('click', () => selectLot(lot));
  poly.bindTooltip(`<b>${lot.name}</b><br>${lot.ha} ha`, {
    className: 'leaflet-tooltip',
    sticky: true
  });
  poly.addTo(map);
  lot._polygon = poly;
});

// Centrar mapa en los lotes reales
const allCoords = LOTS.flatMap(l => l.coords);
map.fitBounds(allCoords, { padding: [60, 60] });

// ─── SIDEBAR ──────────────────────────────────────────────────────────
function renderSidebar() {
  const container = document.getElementById('lots-list');
  container.innerHTML = '';
  LOTS.forEach(lot => {
    const div = document.createElement('div');
    div.className = 'lot-card' + (activeLot === lot ? ' active' : '');
    div.id = 'card-' + lot.id;
    div.onclick = () => selectLot(lot);
    const ndviPct = lot.ndviValue ? Math.round(((lot.ndviValue + 1) / 2) * 100) : 0;
    const ndviColor = lot.ndviValue ? ndviToColor(lot.ndviValue) : '#555';
    const ndviLabel = lot.ndviValue ? lot.ndviValue.toFixed(2) : '---';
    div.innerHTML = `
      <div class="lot-name">${lot.name}</div>
      <div class="lot-meta">${lot.client}</div>
      <div class="lot-ha">${lot.ha} ha</div>
      ${lot.ndviValue ? `
        <div class="lot-ndvi-bar"><div class="lot-ndvi-fill" style="width:${ndviPct}%"></div></div>
        <span class="ndvi-chip" style="background:${ndviColor}22;color:${ndviColor};border:1px solid ${ndviColor}44;">NDVI ${ndviLabel}</span>
      ` : ''}
    `;
    container.appendChild(div);
  });
}

function ndviToColor(v) {
  if (v < 0.1) return '#d73027';
  if (v < 0.2) return '#f46d43';
  if (v < 0.3) return '#fdae61';
  if (v < 0.4) return '#fee08b';
  if (v < 0.5) return '#a6d96a';
  if (v < 0.6) return '#66bd63';
  return '#1a9850';
}

function selectLot(lot) {
  activeLot = lot;
  LOTS.forEach(l => {
    l._polygon.setStyle({ fillOpacity: l === lot ? 0.3 : 0.15, weight: l === lot ? 3.5 : 2.5 });
  });
  map.fitBounds(lot.coords, { padding: [80, 80], maxZoom: 16 });
  document.getElementById('notes-panel').classList.add('open');
  renderNotes(lot);
  renderSidebar();
}

// ─── NOTAS ────────────────────────────────────────────────────────────
function renderNotes(lot) {
  const panel = document.getElementById('notes-panel');
  const lotNotes = notes[lot.id] || [];
  if (lotNotes.length === 0) {
    panel.innerHTML = `<div class="note-empty">Sin anotaciones para<br><strong>${lot.name}</strong></div>`;
  } else {
    panel.innerHTML = lotNotes.map(n => `
      <div class="note-item">
        <div class="note-date">${n.date}</div>
        <div class="note-text">${n.text}</div>
      </div>
    `).join('');
  }
}

// ─── VOZ ──────────────────────────────────────────────────────────────
let mediaRec = null, recChunks = [], isRecording = false;

async function toggleVoice() {
  if (!activeLot) { showToast('Primero seleccioná un lote'); return; }
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRec = new MediaRecorder(stream);
      recChunks = [];
      mediaRec.ondataavailable = e => recChunks.push(e.data);
      mediaRec.onstop = processVoice;
      mediaRec.start();
      isRecording = true;
      document.getElementById('voice-btn').classList.add('recording');
      document.getElementById('voice-icon').textContent = '⏹️';
      document.getElementById('voice-label').textContent = 'Detener grabación';
      document.getElementById('voice-status').textContent = '🔴 Grabando...';
    } catch(e) { showToast('Error al acceder al micrófono'); }
  } else {
    mediaRec.stop();
    mediaRec.stream.getTracks().forEach(t => t.stop());
    isRecording = false;
    document.getElementById('voice-btn').classList.remove('recording');
    document.getElementById('voice-icon').textContent = '🎙️';
    document.getElementById('voice-label').textContent = 'Grabar anotación';
    document.getElementById('voice-status').textContent = 'Procesando...';
  }
}

async function processVoice() {
  try {
    saveNote(activeLot, 'Nota de voz — ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }));
    document.getElementById('voice-status').textContent = '✅ Nota guardada';
  } catch(e) {}
  setTimeout(() => { document.getElementById('voice-status').textContent = ''; }, 3000);
}

function saveNote(lot, text) {
  const now = new Date();
  const date = now.toLocaleDateString('es-AR') + ' ' + now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  notes[lot.id].unshift({ date, text });
  try { localStorage.setItem('aleph_notes', JSON.stringify(notes)); } catch(e) {}
  renderNotes(lot);
  showToast('Anotación guardada en ' + lot.name);
}

// ─── LEYENDA ──────────────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('legend-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 140; canvas.height = 10;
  const colors = ['#d73027','#f46d43','#fdae61','#fee08b','#d9ef8b','#a6d96a','#66bd63','#1a9850'];
  colors.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(i * (140/colors.length), 0, 140/colors.length, 10); });
})();

// ─── UTILS ────────────────────────────────────────────────────────────
function setStatus(type, msg) {
  document.getElementById('sdot').className = type === 'ok' ? 'ok' : '';
  document.getElementById('stxt').textContent = msg;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function showNDVILoading(show) {
  document.getElementById('ndvi-loading').className = show ? 'show' : '';
}

// ─── INIT ─────────────────────────────────────────────────────────────
try {
  const saved = localStorage.getItem('aleph_notes');
  if (saved) Object.assign(notes, JSON.parse(saved));
} catch(e) {}

renderSidebar();
setLayer('sat');
</script>
</body>
</html>
